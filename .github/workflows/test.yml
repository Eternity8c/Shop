name: lint and test
run-name: linter
on:
    push:
        branches:
          - main
          - dev
          - test_ci
    pull_request:
permissions:
    contents: read
jobs:
  inventory:
       runs-on: ubuntu-latest
       outputs:
         services: ${{ steps.emit.outputs.services }}
       steps:
         - id: emit
           run: |
             echo "$svc" | jq -e '(.service | length) > 0' >/dev/null \
              || { echo "::error::empty inventory"; exit 1; }
              echo "services=$svc" >> "$GITHUB_OUTPUT"
  lint:
    needs: [inventory]
    strategy:
      matrix:  ${{ fromJSON(needs.inventory.outputs.services) }}
    name: lint-${{ matrix.service }}
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-go@v7
          with:
            go-version: '1.25.6'
        - run: cd ./${{ matrix.service }} && go mod tidy -diff
        - name: golangci-lint
          uses: golangci/golangci-lint-action@v9
          with:
            version: v2.6
            args: -v -D staticcheck -D unused
            working-directory: ./${{ matrix.service }}
  test:
    needs: [inventory]
    strategy:
      matrix:  ${{ fromJSON(needs.inventory.outputs.services) }}
    name: Run ${{ matrix.service }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.6'
      - name: Run ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        env:
          CONFIG_PATH: ./configs/.env
        run: go test ./... -v -count=1
   

            
        