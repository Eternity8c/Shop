name: verify images
run-name: verify ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  
permissions:
  contents: read
env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: eternity8c/shop
  SERVICES: api-gateway auth-service cart-service product-service

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify GHCR image
        env:
         SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
                tok=$(curl -fsS "https://$DOCKER_REGISTRY/token?scope=repository:$DOCKER_IMAGE_NAME-$svc:pull&service=$DOCKER_REGISTRY" | jq -r .token)
                code=$(curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $tok" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json' \
                  "https://$DOCKER_REGISTRY/v2/$DOCKER_IMAGE_NAME-$svc/manifests/$SHA")
                echo "$DOCKER_IMAGE_NAME-$svc:$SHA -> $code"
                [ "$code" = "200" ] || { echo "::error::image $svc:$SHA not found in GHCR"; exit 1; }
              done

