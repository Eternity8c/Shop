name: verify images
run-name: verify ${{ github.event.workflow_run.head.sha }}

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  
permissions:
  contents: read
env: 
  DOCKER_IMAGE_NAME: eternity8c/shop
  DOCKER_REGISTRY: ghcr.io
  SERVICES: api-gateway auth-service cart-service product-service

jobs:
  verify:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify GHCR image
        env:
         SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: env | grep -E '^(SHA|SERVICES|REGISTRY|IMAGE)=' | sort

