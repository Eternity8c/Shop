name: Load Test
run-name: smoke test

on:
  workflow_run:
    workflows: ["lint and test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name:  .env pass
        run: |
          set -euo pipefail
          cat > auth-service/configs/.env <<'EOF'
          PORT=44044
          TOKEN_TTL=1h
          STORAGE_PATH=postgres://admin:1234@postgres:5432/auth?sslmode=disable
          SECRET=ci-smoke-not-a-secret
          EOF
          cat > product-service/configs/.env <<'EOF'
          PORT=8081
          STORAGE_PATH=postgres://admin:1234@postgres:5432/product?sslmode=disable
          EOF
          cat > api-gateway/configs/.env <<'EOF'
          GATEWAY_PORT=8080
          AUTH_SERVICES_ADDR=auth-service:44044
          PRODUCT_SERVICE_ADDR=product-service:8081
          CART_SERVICE_ADDR=cart-service:8082
          EOF
      - name: Start services
        run: |
          docker compose up -d postgres redis auth-service api-service
          echo "Waiting for services to be ready..."
          for i in {1..7}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/register \
              -H "Content-Type: application/json" \
              -d '{"email":"healthcheck@example.com","password":"hc","full_name":"hc"}' || echo "000")
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "201" ] || [ "$STATUS" = "409" ]; then
              echo "Service ready after $i attempts"
              break
            fi
            sleep 5
          done

      - name: Check services health
        run: |
          docker compose ps
          curl -f http://localhost:8080/ || echo "API Gateway might not have a root endpoint"

      - name: Run K6 Smoke Test
        run: |
          docker compose --profile smoke-test up --abort-on-container-exit k6-smoke

      - name: Show Results
        if: always()
        run: |
          docker compose logs k6-smoke

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker compose --profile smoke-test down -v
